name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          before=$(node -p "require('./package.json').version")
          npm run release
          after=$(node -p "require('./package.json').version")
          if [ "$before" != "$after" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup GitHub Packages registry
        if: steps.release.outputs.published == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@eljijuna'

      - name: Publish to GitHub Packages
        if: steps.release.outputs.published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg set name=@eljijuna/monitor-ui
          npm publish --ignore-scripts --registry https://npm.pkg.github.com
